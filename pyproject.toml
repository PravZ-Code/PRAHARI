[project]
name = "prahari"
version = "1.0.0"
description = "PRAHARI - Predictive Readiness & Holistic Assessment for High-Stress Deployment (MHA/CRPF PS26186)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=42.0.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "redis>=5.0.1",
    "python-dotenv>=1.0.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.4.0",
    "shap>=0.44.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "faker>=22.6.0",
    "scipy>=1.12.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.1.0",
    "qrcode>=7.4.2",
    "openai>=1.14.0",
    "orjson>=3.9.0",
    "lightgbm>=4.3.0",
    "httptools>=0.6.0",
    "zstandard>=0.22.0",
]

[tool.vercel]
entrypoint = "backend.main:app"
