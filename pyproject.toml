[project]
name = "prahari"
version = "1.0.0"
description = "PRAHARI - Predictive Readiness & Holistic Assessment for High-Stress Deployment (MHA/CRPF PS26186)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    "sqlalchemy>=2.0.50",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "cryptography>=44.0.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=5.0.0",
    "redis>=5.0.1",
    "python-dotenv>=1.2.0",
    "xgboost>=3.4.0",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
    "pandas>=3.0.0",
    "numpy>=2.5.0",
    "faker>=22.6.0",
    "scipy>=1.18.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.30",
    "reportlab>=5.0.0",
    "qrcode>=8.2.0",
    "openai>=3.6.0",
    "orjson>=3.12.0",
    "lightgbm>=4.7.0",
    "httptools>=0.8.0",
    "zstandard>=0.25.0",
]

[tool.vercel]
entrypoint = "backend.main:app"
