[project]
name = "prahari"
version = "1.0.0"
description = "PRAHARI - Predictive Readiness & Holistic Assessment for High-Stress Deployment (MHA/CRPF PS26186)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    "sqlalchemy>=2.0.50",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "cryptography>=50.0.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "python-dotenv>=1.0.0",
    "xgboost>=3.4.0",
    "scikit-learn>=1.9.0",
    "pandas>=3.0.0",
    "numpy>=2.5.0",
    "scipy>=1.18.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.30",
    "reportlab>=5.0.0",
    "qrcode>=8.2",
    "orjson>=3.12.0",
    "httptools>=0.8.0",
    "websockets>=15.0",
    "redis>=8.1.0",
    "alembic>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
testpaths = ["backend/tests"]

